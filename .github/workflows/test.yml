name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # 빌드까지 해야 클라이언트(JSX) 쪽 오류가 걸린다. vitest는 서버 코드만 불러온다.
      - run: npm run build
